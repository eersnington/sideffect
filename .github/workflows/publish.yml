name: Release Sideffect
run-name: Release Sideffect ${{ inputs.version }} to npm and GitHub

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Sideffect release-set version, e.g. 0.3.0
        required: true
      confirm:
        description: Type publish sideffect@<version> and @sideffect/lint@<version>
        required: true
      npm_tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - beta

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      # npm Trusted Publishing requires npm >= 11.5.1 and Node >= 22.14.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Validate release request
        env:
          INPUT_CONFIRM: ${{ inputs.confirm }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          sideffect_version="$(node -p "require('./packages/sideffect/package.json').version")"
          lint_version="$(node -p "require('./packages/lint-plugin/package.json').version")"

          if [ "${sideffect_version}" != "${lint_version}" ]; then
            printf 'Refusing to publish: packages/sideffect/package.json version "%s" does not match packages/lint-plugin/package.json version "%s". Run bun run changeset:version and commit the generated release changes before publishing.\n' "${sideffect_version}" "${lint_version}" >&2
            exit 1
          fi

          package_version="${sideffect_version}"
          expected_confirm="publish sideffect@${package_version} and @sideffect/lint@${package_version}"

          if [ "${INPUT_VERSION}" != "${package_version}" ]; then
            printf 'Refusing to publish: workflow input version "%s" does not match the Sideffect release-set version "%s". Run bun run changeset:version and dispatch this workflow with the exact package version.\n' "${INPUT_VERSION}" "${package_version}" >&2
            exit 1
          fi

          if [ "${INPUT_CONFIRM}" != "${expected_confirm}" ]; then
            printf 'Refusing to publish: confirmation must exactly equal "%s". No package was published.\n' "${expected_confirm}" >&2
            exit 1
          fi

          pending_changesets="$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print)"
          if [ -n "${pending_changesets}" ]; then
            printf 'Refusing to publish: pending changeset files are still present. Run bun run changeset:version, commit the generated release changes, then dispatch this workflow again.\n%s\n' "${pending_changesets}" >&2
            exit 1
          fi

          sideffect_published=false
          if npm view "sideffect@${package_version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            sideffect_published=true
          fi

          lint_published=false
          if npm view "@sideffect/lint@${package_version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            lint_published=true
          fi

          if [ "${sideffect_published}" != "${lint_published}" ]; then
            printf 'Refusing to continue: the %s release set is only partially published on npm. No additional package was published.\n' "${package_version}" >&2
            exit 1
          fi

          if [ "${sideffect_published}" = true ]; then
            printf 'Both packages are already published at %s; continuing validation so the GitHub release can be repaired.\n' "${package_version}"
          fi

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Check packages
        run: bun run check

      - name: Test packages
        run: bun run test

      # Build before packing so the release tarballs contain package outputs.
      - name: Build packages
        run: bun run build

      - name: Run Cloudflare workflow E2E
        run: bun run test:e2e

      - name: Create release artifact directory
        run: mkdir -p release-artifacts

      # Bun resolves catalog: dependencies to publishable versions while packing.
      - name: Pack sideffect
        working-directory: packages/sideffect
        run: bun pm pack --destination ../../release-artifacts

      - name: Pack lint plugin
        working-directory: packages/lint-plugin
        run: bun pm pack --destination ../../release-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: sideffect-packages
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      # npm Trusted Publishing requires npm >= 11.5.1 and Node >= 22.14.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: sideffect-packages
          path: release-artifacts

      - name: Publish release set (OIDC, no token)
        env:
          INPUT_VERSION: ${{ inputs.version }}
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          sideffect_published=false
          if npm view "sideffect@${INPUT_VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            sideffect_published=true
          fi

          lint_published=false
          if npm view "@sideffect/lint@${INPUT_VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            lint_published=true
          fi

          if [ "${sideffect_published}" != "${lint_published}" ]; then
            printf 'Refusing to continue: the %s release set is only partially published on npm. No additional package was published.\n' "${INPUT_VERSION}" >&2
            exit 1
          fi

          if [ "${sideffect_published}" = true ]; then
            sideffect_tag_version="$(npm view "sideffect@${NPM_TAG}" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            lint_tag_version="$(npm view "@sideffect/lint@${NPM_TAG}" version --registry=https://registry.npmjs.org 2>/dev/null || true)"

            if [ "${sideffect_tag_version}" != "${INPUT_VERSION}" ] || [ "${lint_tag_version}" != "${INPUT_VERSION}" ]; then
              printf 'Refusing to repair the GitHub release: npm tag %s does not point both packages to %s.\n' "${NPM_TAG}" "${INPUT_VERSION}" >&2
              exit 1
            fi

            printf 'Both packages are already published at %s; skipping npm publication.\n' "${INPUT_VERSION}"
          else
            npm publish "./release-artifacts/sideffect-${INPUT_VERSION}.tgz" --provenance --tag "${NPM_TAG}" --ignore-scripts
            npm publish "./release-artifacts/sideffect-lint-${INPUT_VERSION}.tgz" --provenance --tag "${NPM_TAG}" --ignore-scripts
          fi

  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Generate release notes
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: node .github/scripts/generate-release-notes.mjs "${INPUT_VERSION}" > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          tag="v${INPUT_VERSION}"
          title="Sideffect ${INPUT_VERSION}"

          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "${tag}")"
            if [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
              printf 'Refusing to update tag %s: it points to %s instead of the published commit %s.\n' "${tag}" "${tag_commit}" "${GITHUB_SHA}" >&2
              exit 1
            fi
          fi

          release_flags=(--latest)
          if [ "${NPM_TAG}" != "latest" ]; then
            release_flags=(--prerelease --latest=false)
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" \
              --title "${title}" \
              --notes-file release-notes.md \
              "${release_flags[@]}"
          else
            gh release create "${tag}" \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes-file release-notes.md \
              "${release_flags[@]}"
          fi
